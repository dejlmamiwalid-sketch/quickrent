<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>QuickRent | عقارك بسهولة</title>
        <style>
            * { box-sizing: border-box; }
                body {
                      margin: 0;
                            font-family: Arial, sans-serif;
                                  background: #f4f7fb;
                                        color: #172033;
                                            }
                                                header {
                                                      background: #123b70;
                                                            color: white;
                                                                  padding: 22px 16px;
                                                                        text-align: center;
                                                                            }
                                                                                header h1 { margin: 0 0 8px; font-size: 32px; }
                                                                                    header p { margin: 0; }
                                                                                        nav {
                                                                                              background: white;
                                                                                                    padding: 14px;
                                                                                                          text-align: center;
                                                                                                              }
                                                                                                                  nav a {
                                                                                                                        color: #123b70;
                                                                                                                              text-decoration: none;
                                                                                                                                    margin: 0 10px;
                                                                                                                                          font-weight: bold;
                                                                                                                                              }
                                                                                                                                                  main {
                                                                                                                                                        max-width: 850px;
                                                                                                                                                              margin: 24px auto;
                                                                                                                                                                    padding: 0 14px;
                                                                                                                                                                        }
                                                                                                                                                                            .hero, .form, .listing {
                                                                                                                                                                                  background: white;
                                                                                                                                                                                        padding: 22px;
                                                                                                                                                                                              margin-bottom: 20px;
                                                                                                                                                                                                    border-radius: 14px;
                                                                                                                                                                                                          box-shadow: 0 3px 12px #0000000c;
                                                                                                                                                                                                              }
                                                                                                                                                                                                                  h2 { color: #123b70; }
                                                                                                                                                                                                                      label { display: block; margin-top: 14px; }
                                                                                                                                                                                                                          input, select, button {
                                                                                                                                                                                                                                width: 100%;
                                                                                                                                                                                                                                      padding: 12px;
                                                                                                                                                                                                                                            margin-top: 7px;
                                                                                                                                                                                                                                                  border: 1px solid #ccd5e1;
                                                                                                                                                                                                                                                        border-radius: 8px;
                                                                                                                                                                                                                                                              font-size: 16px;
                                                                                                                                                                                                                                                                  }
                                                                                                                                                                                                                                                                      button {
                                                                                                                                                                                                                                                                            background: #1769e0;
                                                                                                                                                                                                                                                                                  color: white;
                                                                                                                                                                                                                                                                                        border: 0;
                                                                                                                                                                                                                                                                                              cursor: pointer;
                                                                                                                                                                                                                                                                                                    margin-top: 18px;
                                                                                                                                                                                                                                                                                                        }
                                                                                                                                                                                                                                                                                                            .price { color: #087b55; font-weight: bold; }
                                                                                                                                                                                                                                                                                                                footer { text-align: center; padding: 24px; color: #657086; }
                                                                                                                                                                                                                                                                                                                  </style>
                                                                                                                                                                                                                                                                                                                  </head>
                                                                                                                                                                                                                                                                                                                  <body>
                                                                                                                                                                                                                                                                                                                    <header>
                                                                                                                                                                                                                                                                                                                        <h1>QuickRent</h1>
                                                                                                                                                                                                                                                                                                                            <p>اعثر على عقارك بسهولة وأمان</p>
                                                                                                                                                                                                                                                                                                                              </header>

                                                                                                                                                                                                                                                                                                                                <nav>
                                                                                                                                                                                                                                                                                                                                    <a href="#search">البحث</a>
                                                                                                                                                                                                                                                                                                                                        <a href="#add">أضف عقارك</a>
                                                                                                                                                                                                                                                                                                                                            <a href="#listings">العقارات</a>
                                                                                                                                                                                                                                                                                                                                              </nav>

                                                                                                                                                                                                                                                                                                                                                <main>
                                                                                                                                                                                                                                                                                                                                                    <section class="hero" id="search">
                                                                                                                                                                                                                                                                                                                                                          <h2>ابحث عن عقارك</h2>
                                                                                                                                                                                                                                                                                                                                                                <p>شقق للإيجار والبيع وأراضٍ للبيع في الجزائر.</p>
                                                                                                                                                                                                                                                                                                                                                                      <label for="city">المدينة</label>
                                                                                                                                                                                                                                                                                                                                                                            <input id="city" placeholder="مثال: الجزائر العاصمة">
                                                                                                                                                                                                                                                                                                                                                                                  <label for="kind">نوع العقار</label>
                                                                                                                                                                                                                                                                                                                                                                                        <select id="kind">
                                                                                                                                                                                                                                                                                                                                                                                                <option>شقة للإيجار</option>
                                                                                                                                                                                                                                                                                                                                                                                                        <option>شقة للبيع</option>
                                                                                                                                                                                                                                                                                                                                                                                                                <option>أرض للبيع</option>
                                                                                                                                                                                                                                                                                                                                                                                                                      </select>
                                                                                                                                                                                                                                                                                                                                                                                                                            <button onclick="searchListings()">ابحث الآن</button>
                                                                                                                                                                                                                                                                                                                                                                                                                                  <p id="searchMessage"></p>
                                                                                                                                                                                                                                                                                                                                                                                                                                      </section>

                                                                                                                                                                                                                                                                                                                                                                                                                                          <section class="form" id="add">
                                                                                                                                                                                                                                                                                                                                                                                                                                                <h2>أضف عقارك</h2>
                                                                                                                                                                                                                                                                                                                                                                                                                                                      <label for="title">عنوان الإعلان</label>
                                                                                                                                                                                                                                                                                                                                                                                                                                                            <input id="title" placeholder="مثال: شقة جميلة وسط المدينة">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                  <label for="location">المدينة</label>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <input id="location" placeholder="اسم المدينة">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                              <label for="type">نوع العقار</label>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <select id="type">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <option>شقة للإيجار</option>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <option>شقة للبيع</option>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <option>أرض للبيع</option>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  </select>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <label for="price">السعر بالدينار الجزائري (دج)</label>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              <input id="price" type="number" min="1" placeholder="مثال: 25000">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <button onclick="addListing()">إضافة الإعلان التجريبي</button>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          <p id="addMessage"></p>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              </section>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  <section id="listings">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <h2>العقارات المعروضة</h2>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              <div id="results">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      <p>لا توجد إعلانات حتى الآن. يمكنك إضافة إعلان تجريبي أعلاه.</p>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </section>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  </main>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <footer>© 2026 QuickRent — عقارك يبدأ من هنا</footer>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      <script>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          const listings = [];

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              function addListing() {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    const title = document.getElementById('title').value.trim();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          const location = document.getElementById('location').value.trim();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                const type = document.getElementById('type').value;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      const price = Number(document.getElementById('price').value);

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            if (!title || !location || price <= 0) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    document.getElementById('addMessage').textContent =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              'يرجى ملء جميع الحقول وإدخال سعر صحيح.';
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      return;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  listings.push({ title, location, type, price });
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        showListings(listings);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              document.getElementById('addMessage').textContent =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      'تمت إضافة الإعلان التجريبي بنجاح.';
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            document.getElementById('title').value = '';
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  document.getElementById('location').value = '';
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        document.getElementById('price').value = '';
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                function showListings(items) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      const results = document.getElementById('results');
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            results.innerHTML = '';

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  if (!items.length) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          results.textContent = 'لا توجد نتائج مطابقة.';
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  return;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              items.forEach(item => {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      const card = document.createElement('article');
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              card.className = 'listing';

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      const heading = document.createElement('h3');
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              heading.textContent = item.title;

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      const details = document.createElement('p');
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              details.textContent = item.location + ' — ' + item.type;

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      const price = document.createElement('p');
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              price.className = 'price';
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      price.textContent = item.price.toLocaleString('fr-DZ') + ' دج';

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              card.append(heading, details, price);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      results.appendChild(card);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            });
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    function searchListings() {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          const city = document.getElementById('city').value.trim();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                const kind = document.getElementById('kind').value;

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      const matches = listings.filter(item =>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              (!city || item.location.includes(city)) && item.type === kind
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    );

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          showListings(matches);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                document.getElementById('listings').scrollIntoView({
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        behavior: 'smooth'
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              });
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </script>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </body>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </html>
